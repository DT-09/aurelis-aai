<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURELIS Access</title><link rel="stylesheet" href="/site.css"></head><body><main style="max-width:720px;margin:0 auto;padding:12vh 24px"><div class="eyebrow">SECURE ACCESS</div><h1 style="font:500 64px 'Bodoni Moda';margin:0 0 20px">AURELIS <span style="color:#4c8dff">Access</span></h1><p style="color:#9ca3ae;line-height:1.8">Human access is authenticated by session. API credentials are separate machine credentials. Paid-client entitlements are enforced server-side.</p><div id="panel" class="system-card" style="margin-top:35px"></div></main><script>const p=document.getElementById('panel'),q=new URLSearchParams(location.search),invite=q.get('invite');async function load(){if(invite){const r=await fetch('/api/invite?token='+encodeURIComponent(invite));const d=await r.json();if(!d.valid){p.innerHTML='<b>Invitation invalid or expired.</b>';return}p.innerHTML='<div class="eyebrow">CLIENT INVITATION</div><h2 style="font:500 34px Bodoni Moda">'+d.tenantName+'</h2><p>'+d.email+'</p><input id="pw" type="password" placeholder="Create password" style="width:100%;padding:14px;background:#090b0f;color:#f2eee5;border:1px solid #384354"><button id="join">Create secure access</button>';document.getElementById('join').onclick=async()=>{const r=await fetch('/api/invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:invite,password:document.getElementById('pw').value})});if(r.ok)location='/client.html';else alert((await r.json()).error||'Unable to activate')}}else{p.innerHTML='<div class="eyebrow">AUTHENTICATION</div><input id="em" placeholder="Email" style="width:100%;padding:14px;background:#090b0f;color:#f2eee5;border:1px solid #384354;margin-bottom:10px"><input id="pw" type="password" placeholder="Password" style="width:100%;padding:14px;background:#090b0f;color:#f2eee5;border:1px solid #384354"><button id="login">Enter AURELIS</button>';document.getElementById('login').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});if(r.ok){const d=await r.json();location=d.role==='OWNER'||d.role==='OPERATOR'?'/operator.html':'/client.html'}else alert('Invalid credentials')}}}load()</script></body></html>
