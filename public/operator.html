<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelis — Operator</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><a class="brand" href="/"><span class="mark">ϟ</span>AURELIS</a><span style="font-size:10px;letter-spacing:.14em;color:#7e8997">OPERATOR CONTROL PLANE</span><button id="logout" class="nav-access">Sign out</button></header><main class="section" style="padding-top:150px"><div class="eyebrow">OPERATOR</div><h1 style="font:400 60px var(--serif);margin:0">Assurance operations.</h1><p style="color:#909aa7;max-width:700px">Record bounded assessments, inspect tenant-scoped evidence and maintain explicit control states.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:50px"><form id="f" style="border:1px solid var(--line);padding:25px"><div class="eyebrow">RECORD ASSESSMENT</div><input id="system" placeholder="System name" required style="width:100%;padding:12px;background:#080b10;color:#eee;border:1px solid var(--line);margin:8px 0"><input id="domain" placeholder="Assurance domain" required style="width:100%;padding:12px;background:#080b10;color:#eee;border:1px solid var(--line);margin:8px 0"><select id="decision" style="width:100%;padding:12px;background:#080b10;color:#eee;border:1px solid var(--line);margin:8px 0"><option>ALLOW</option><option>ALLOW_WITH_CONSTRAINTS</option><option>ESCALATE</option><option>DENY</option></select><textarea id="summary" placeholder="Bounded finding or outcome" style="width:100%;min-height:100px;padding:12px;background:#080b10;color:#eee;border:1px solid var(--line);margin:8px 0"></textarea><button class="button primary" style="border:0;cursor:pointer">Record assessment</button><div id="msg" style="font-size:11px;color:#8f9aa7;margin-top:12px"></div></form><div><div class="eyebrow">CURRENT CONTEXT</div><div id="records" style="display:grid;gap:10px"></div></div></div></main><script>async function load(){const r=await fetch('/api/context');if(r.status===401||r.status===403){location='/access.html';return}const d=await r.json();records.innerHTML=(d.assessments||[]).slice(0,10).map(x=>`<div style="border:1px solid var(--line);padding:16px;background:rgba(255,255,255,.02)"><b>${x.system_name}</b><div style="font-size:10px;color:#778292;margin-top:5px">${x.domain} · ${x.decision}</div></div>`).join('')||'<span style="color:#7d8795">No records.</span>'}f.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';const r=await fetch('/api/assessment',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({system_name:system.value,domain:domain.value,decision:decision.value,status:'controlled',summary:summary.value})});const d=await r.json();msg.textContent=r.ok?'Recorded '+d.id:d.error||'Unable to save';if(r.ok){f.reset();load()}};logout.onclick=async()=>{await fetch('/api/auth',{method:'DELETE'});location='/access.html'};load();</script></body></html>
