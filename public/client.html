<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelis — Client Assurance</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><a class="brand" href="/"><span class="mark">ϟ</span>AURELIS</a><span style="font-size:10px;letter-spacing:.14em;color:#7e8997">CLIENT ASSURANCE</span><button id="logout" class="nav-access">Sign out</button></header><main class="section" style="padding-top:150px"><div class="eyebrow">ASSURANCE STATUS</div><h1 style="font:400 60px var(--serif);margin:0 0 15px">Your AI control posture.</h1><p style="color:#909aa7;max-width:700px">A bounded view of the systems, decisions and evidence associated with your organization. No cross-tenant data is exposed.</p><div id="stats" class="problem-grid" style="margin-top:50px"></div><section style="margin-top:70px"><div class="eyebrow">RECENT ASSURANCE RECORDS</div><div id="records" style="display:grid;gap:10px"></div></section></main><script>async function load(){const r=await fetch('/api/context');if(r.status===401){location='/access.html';return}if(!r.ok){records.textContent='Unable to load assurance context.';return}const d=await r.json();stats.innerHTML=[[d.stats.total||0,'ASSESSMENTS'],[d.stats.controlled||0,'CONTROLLED'],[d.stats.denied||0,'DENIED']].map(x=>`<article><span>${x[1]}</span><h3 style="font:400 38px var(--serif)">${x[0]}</h3><p>Current tenant-scoped records.</p></article>`).join('');records.innerHTML=(d.assessments||[]).map(x=>`<div style="border:1px solid var(--line);padding:20px;background:rgba(255,255,255,.02);display:grid;grid-template-columns:1fr auto;gap:8px"><div><b>${x.system_name}</b><div style="font-size:10px;color:#7c8794;margin-top:6px">${x.domain} · ${x.id}</div><p style="font-size:12px;color:#929ca8;margin:12px 0 0">${x.summary}</p></div><strong style="color:${x.decision==='DENY'?'var(--red)':x.decision==='ALLOW'?'var(--green)':'var(--amber)'}">${x.decision}</strong></div>`).join('')||'<div style="color:#7d8795">No assurance records yet.</div>'}load();logout.onclick=async()=>{await fetch('/api/auth',{method:'DELETE'});location='/access.html'};</script></body></html>
