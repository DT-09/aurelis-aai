<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURELIS AAI — Client Engine</title><link rel="stylesheet" href="app.css"></head><body><header><div class="brand">AURELIS <span>CLIENT ENGINE</span></div><a href="/">Public site</a></header><main><section class="contact"><div class="eyebrow">RESTRICTED CLIENT PLANE</div><h2>Authenticate to your assurance workspace.</h2><p>Your workspace is tenant-scoped and entitlement-gated. An active client credential is required. Unpaid/public visitors cannot access client engine data.</p><input id="key" placeholder="Client key" style="padding:14px;width:100%;background:#151518;color:#f1eee7;border:1px solid #3a3a40"><button id="login" class="button" style="margin-top:15px;background:#3a1820;color:#f1eee7">Authenticate</button><pre id="result"></pre></section></main><script>document.querySelector('#login').onclick=async()=>{const k=document.querySelector('#key').value;const r=await fetch('/api/client',{headers:{'X-AAI-Key':k}});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2);}</script></body></html>
