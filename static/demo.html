<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAI Benchmark</title><link rel="stylesheet" href="/app.css"></head><body><nav><a class="brand" href="/">AAI</a><div><a class="button small" href="/access.html">Control Plane</a></div></nav><main style="padding-top:70px"><div class="eyebrow">PUBLIC BENCHMARK · DETERMINISTIC DEMO</div><h1 style="font-size:58px">Run an assurance decision.</h1><p class="lead">Change the inputs. Watch the engine produce a decision and evidence object.</p><div class="grid three"><article><b>RELIABILITY</b><input id="rel" type="range" min="50" max="100" value="98" style="width:100%"><h2 id="rv">98</h2></article><article><b>CRITICAL FAILURES</b><input id="crit" type="range" min="0" max="2" value="0" style="width:100%"><h2 id="cv">0</h2></article><article><b>AUTHORITY</b><select id="auth" style="width:100%;padding:12px;background:#07090d;color:white;border:1px solid #202735"><option value="true">Authorized</option><option value="false">Outside policy</option></select></article></div><button class="button" style="margin-top:22px" onclick="run()">Evaluate workflow</button><section class="section"><div id="out"></div></section></main><script>async function run(){const body={system:{system_id:'demo-agent',name:'Invoice Processing Agent',version:'4.2.1',environment:'production'},metrics:{reliability:+rel.value,critical_failures:+crit.value},authorized:auth.value==='true'};rv.textContent=rel.value;cv.textContent=crit.value;const r=await fetch('/api/assurance/evaluate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(x=>x.json());out.innerHTML=`<div class="status-card"><div class="eyebrow">ENGINE RESULT</div><h2>${r.decision}</h2><p>${r.reason}</p><div class="trace"><span>STATE ${r.state}</span><span>RISK ${r.risk}</span><span>EVIDENCE ${r.evidence.id}</span></div><pre>${JSON.stringify(r.evidence,null,2)}</pre></div>`}run()</script></body></html>
