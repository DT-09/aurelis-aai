<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAI Evidence</title><link rel="stylesheet" href="/app.css"></head><body><nav><a class="brand" href="/">AAI</a><div><a href="/dashboard.html">Control Plane</a></div></nav><main style="padding-top:55px"><div class="eyebrow">EVIDENCE FABRIC</div><h1 style="font-size:56px">Evidence.</h1><p class="lead">Portable records generated by assurance activity.</p><div id="list" class="grid"></div></main><script>(async()=>{const d=await fetch('/api/evidence').then(r=>r.json());list.innerHTML=d.evidence.map(e=>`<article><b>${e.type||'EVIDENCE'}</b><h3>${e.id}</h3><p>${e.source||'AAI Engine'} · ${e.created_at}</p><code>${e.sha256||''}</code></article>`).join('')})()</script></body></html>
