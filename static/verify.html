<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Evidence — AAI</title><link rel="stylesheet" href="/app.css"></head><body><main style="max-width:760px;padding-top:12vh"><div class="eyebrow">PUBLIC VERIFIER</div><h1 style="font-size:58px">Verify evidence.</h1><p class="lead">Paste a JSON payload and its SHA-256 hash to check deterministic integrity.</p><textarea id="payload" rows="10" style="width:100%;background:#0d1118;border:1px solid #202735;color:white;padding:16px;border-radius:8px">{"claim":"Tool authority bounded","control":"AI-AGENT-03","result":"PASS"}</textarea><input id="hash" placeholder="sha256 hash" style="width:100%;margin:12px 0;padding:14px;background:#0d1118;border:1px solid #202735;color:white;border-radius:8px"><button class="button" onclick="verify()">Verify</button><div id="out" style="margin-top:25px"></div></main><script>async function verify(){let p;try{p=JSON.parse(payload.value)}catch{out.textContent='Invalid JSON';return}const r=await fetch('/api/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({payload:p,sha256:hash.value.trim()})}).then(x=>x.json());out.innerHTML=`<div class="status-card"><h2>${r.valid?'VERIFIED':'NOT VERIFIED'}</h2><p>Expected: ${r.expected}</p><p>Supplied: ${r.supplied||'—'}</p></div>`}</script></body></html>
